name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r demo_app/backend/requirements.txt

      - name: Lint with flake8
        run: |
          flake8 . \
            --max-line-length=100 \
            --exclude=venv,chroma_db,__pycache__,node_modules \
            --ignore=E501,W503

      - name: Check imports resolve
        run: |
          python -c "from rag_engine.config import config; print('config OK')"
          python -c "from rag_engine.knowledge_base.chunker import TextChunker; print('chunker OK')"
          python -c "from rag_engine.knowledge_base.embedder import Embedder; print('embedder OK')"
          python -c "from rag_engine.sources.test_code.loader import CodebaseLoader; print('codebase_loader OK')"
          python -c "from rag_engine.sources.test_reports.loader import TestResultsLoader; print('test_results_loader OK')"
          python -c "from rag_engine.features.llm_utils import response_text; print('llm_utils OK')"

      - name: Run unit tests
        run: |
          pytest tests/unit -v --tb=short

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Retrieval eval (Jira)
        run: |
          python -m rag_engine.sources.jira.index
          python -m tests.evals.eval_retrieval --min-hit-at-k 0.9 --min-mrr 0.85
        env:
          JIRA_URL: "https://mock.atlassian.net"
          JIRA_TOKEN: "mock_token"
          CONFLUENCE_URL: "https://mock.atlassian.net"
          CONFLUENCE_TOKEN: "mock_token"

  api-check:
    name: API Startup Check
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify FastAPI app loads
        run: |
          python -c "
          import os
          os.environ['ANTHROPIC_API_KEY'] = 'test'
          os.environ['JIRA_URL'] = 'https://mock.atlassian.net'
          os.environ['JIRA_TOKEN'] = 'mock'
          os.environ['CONFLUENCE_URL'] = 'https://mock.atlassian.net'
          os.environ['CONFLUENCE_TOKEN'] = 'mock'
          from rag_engine.api import app
          print('FastAPI app loaded OK')
          "

  demo-app:
    name: Demo App (API conformance + UI tests)
    runs-on: ubuntu-latest
    env:
      # Pinned commit of https://github.com/realworld-apps/realworld for the API conformance tests
      REALWORLD_SPEC_SHA: ebbcdeb8d55b42a3a613c787560498b8ef10003f
      HURL_VERSION: 8.0.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            demo_app/frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r demo_app/backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: demo_app/frontend
        run: npm ci

      - name: Frontend unit tests
        working-directory: demo_app/frontend
        run: npx vitest run

      - name: Frontend build
        working-directory: demo_app/frontend
        run: npx ng build

      - name: Start backend
        run: |
          python -m demo_app.backend.seed
          nohup python -m uvicorn demo_app.backend.main:app --port 3000 > backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/tags && exit 0; sleep 1; done
          echo "::error::Backend did not start"; cat backend.log; exit 1

      - name: API conformance tests (official RealWorld Hurl suite)
        run: |
          curl -sSLo hurl.deb "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl_${HURL_VERSION}_amd64.deb"
          sudo apt-get install -y ./hurl.deb
          git clone --quiet https://github.com/realworld-apps/realworld.git realworld-spec
          git -C realworld-spec checkout --quiet "$REALWORLD_SPEC_SHA"
          HOST=http://localhost:3000 bash realworld-spec/specs/api/hurl/run-hurl-tests.sh

      - name: Start frontend
        working-directory: demo_app/frontend
        run: |
          nohup npm start > ../../frontend.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:4200/ > /dev/null && exit 0; sleep 2; done
          echo "::error::Frontend did not start"; cat ../../frontend.log; exit 1

      - name: Cypress UI tests
        env:
          CONDUIT_PYTHON: python
        run: |
          npm ci
          npm run test:demo-app

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: tests/e2e/screenshots
          if-no-files-found: ignore

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-app-logs
          path: |
            backend.log
            frontend.log
          if-no-files-found: ignore
